# Render Blueprint. Point Render at this repository and it reads this file.
#
# The database lives outside Render (Neon, Frankfurt), so no database is
# declared here. Render's own free Postgres plan allows one instance per
# workspace and is deleted after 30 days, which is why it is not used.
#
# Values marked sync: false are set in the Render dashboard and never committed.

services:
  - type: web
    name: solarupgrade
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Same region as the Neon project, so queries stay inside Frankfurt.
    region: frankfurt
    branch: master

    # Actuator health endpoint; Render uses it to gate a deploy going live.
    healthCheckPath: /actuator/health

    envVars:
      # postgres = the external Neon database, resend = transactional email.
      - key: SPRING_PROFILES_ACTIVE
        value: postgres,resend

      # --- Neon (Project Dashboard -> Connect) -------------------------------
      # Host, database and user are not secret; the password is.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      # Neon terminates TLS and refuses plaintext, so require it rather than
      # relying on the "prefer" default.
      - key: DB_SSL_MODE
        value: require

      # Neon's free plan allows few connections and scales to zero when idle.
      # A small pool that drains fully lets it suspend instead of burning the
      # monthly compute allowance on an idle connection.
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_POOL_MIN_IDLE
        value: "0"

      # --- Resend (https://resend.com/api-keys) ------------------------------
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: SolarUpgrade <orders@auth.cgreglab.space>

      # Verification links must be absolute and point at the public hostname;
      # the app cannot infer it from behind Render's proxy.
      - key: APP_BASE_URL
        value: https://solarupgrade.onrender.com

      # --- PayPal (https://developer.paypal.com/dashboard/applications) ------
      # Declared here even though the values are set in the dashboard. Left
      # undeclared, they existed only as something typed in by hand: recreate
      # the service or re-apply this blueprint and they are gone, PayPalClient
      # never registers, and the shop keeps serving pages with no way to pay
      # and nothing saying so.
      #
      # PAYPAL_ENV must be sandbox or live. Anything else stops the app at
      # startup on purpose -- guessing would send real customers to the test
      # PayPal, where no money moves and no order ever settles.
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      # Without the webhook id the app cannot tell a genuine notification from
      # a forged one, so it ignores all of them and payments settle only on the
      # customer's return from PayPal.
      - key: PAYPAL_WEBHOOK_ID
        sync: false

      # --- Follow-up email --------------------------------------------------
      # Off by default in the application, which meant the reminder job was
      # never registered here at all. On, so an unpaid order gets its one nudge
      # before it lapses.
      - key: APP_PAYMENT_REMINDERS_ENABLED
        value: "true"
      - key: APP_PAYMENT_REMINDERS_AFTER_HOURS
        value: "24"

      # Unpaid orders hold their stock until this many hours have passed, then
      # it goes back on the shelf. Longer than the reminder above, so the
      # customer is chased before the order lapses rather than after.
      - key: APP_ORDER_EXPIRY_AFTER_HOURS
        value: "72"

      # --- Admin ------------------------------------------------------------
      # Comma-separated addresses that hold ROLE_ADMIN. The accounts must
      # already exist: register and verify through the ordinary front door
      # first, then name them here. This variable is the whole truth about who
      # is an administrator — an address removed from it loses the role on the
      # next start. sync: false so the list is not committed.
      - key: APP_ADMIN_EMAILS
        sync: false

      # Hostname whose front page opens on the admin dashboard instead of the
      # shop. Set it once a domain actually points here; /admin works on the
      # main address regardless, and the admin area is protected by the role
      # rather than by which hostname was used.
      #
      # Note: Render cannot issue admin.solarupgrade.onrender.com. An
      # onrender.com address is <service-name>.onrender.com and goes no deeper,
      # so the choices are a custom domain (admin.yourdomain.com, added under
      # Settings -> Custom Domains and pointed here with a CNAME) or a second
      # service named admin-solarupgrade. A custom domain is the better one:
      # a second service is a second container, a second cold start, and a
      # second copy to keep in step.
      - key: APP_ADMIN_HOST
        sync: false
