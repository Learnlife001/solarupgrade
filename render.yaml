# Render Blueprint. Point Render at this repository and it reads this file,
# creating both the database and the web service.
#
# The database credentials are wired from the managed Postgres below via
# fromDatabase, so there is nothing to copy by hand and no password ends up in
# this file. The only secret you set yourself is the Resend API key.

databases:
  - name: solarupgrade-db
    databaseName: solarupgrade
    user: solarupgrade
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []   # empty = reachable only from inside Render, not the internet

services:
  - type: web
    name: solarupgrade
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Same region as the database, so they talk over Render's private network.
    region: frankfurt
    branch: master

    # Actuator health endpoint; Render uses it to gate a deploy going live.
    healthCheckPath: /actuator/health

    envVars:
      # postgres = the managed database below, resend = transactional email.
      - key: SPRING_PROFILES_ACTIVE
        value: postgres,resend

      # --- Database: filled in by Render from solarupgrade-db ----------------
      - key: DB_HOST
        fromDatabase:
          name: solarupgrade-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: solarupgrade-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: solarupgrade-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: solarupgrade-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: solarupgrade-db
          property: password

      # Private network between service and database; see the note in
      # application-postgres.properties.
      - key: DB_SSL_MODE
        value: prefer
      # The free database plan allows few connections.
      - key: DB_POOL_SIZE
        value: "5"

      # --- Resend: the one value you set yourself ----------------------------
      # https://resend.com/api-keys
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: SolarUpgrade <orders@auth.cgreglab.space>
