# PostgreSQL profile. Provider-neutral -- it works against Render Postgres,
# Supabase, or a local server; only the environment variables differ.
# Activate with: SPRING_PROFILES_ACTIVE=postgres
#
# Every value comes from the environment, so nothing secret is committed.
# On Render these are wired automatically from the database declared in
# render.yaml; there is nothing to copy by hand.

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSL_MODE:prefer}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Managed Postgres plans cap connections, and a web service can run several
# instances, so keep each pool small rather than exhausting the database.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1

# Flyway owns the schema; Hibernate only checks the entities still match.
spring.jpa.hibernate.ddl-auto=validate

spring.h2.console.enabled=false

# Never seed the demo account into a real database.
app.seed-demo-data=false

# --- A note on sslmode -------------------------------------------------------
# The default is "prefer": negotiate TLS when the server offers it, carry on
# when it does not. That is deliberate. On Render the application reaches its
# database over Render's private network, where the endpoint may not present a
# certificate, and a hard "require" would fail the connection outright on first
# boot. Reaching a database across the public internet -- Supabase, or Render's
# external hostname -- should set DB_SSL_MODE=require to insist on encryption.
