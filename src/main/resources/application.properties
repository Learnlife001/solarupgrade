spring.application.name=shopping-webapp

# --- Datasource -------------------------------------------------------------
# Defaults to an in-memory H2 database so the app runs with no setup. Use the
# "mysql" profile for a real database (see application-mysql.properties).
spring.datasource.url=jdbc:h2:mem:solarupgrade;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway owns the schema; Hibernate only checks the entities still match it.
# A mismatch fails startup (and therefore the build) rather than surfacing as a
# broken query later.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# {vendor} resolves to h2, mysql or postgresql, picking the matching directory.
spring.flyway.locations=classpath:db/migration/{vendor}

# Seeds the demo catalogue and the demo account whose password is in the README.
# True only here, in the throwaway in-memory database. Every profile that points
# at a real database turns it off.
app.seed-demo-data=true

# Absolute base for links in outgoing email (the verification link). The app
# cannot work its own public address out from behind a proxy, so deployments
# must set APP_BASE_URL.
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Browse the dev database at http://localhost:8080/h2-console
spring.h2.console.enabled=true

# --- Mail -------------------------------------------------------------------
# Left unset on purpose. Without spring.mail.host Spring Boot does not create a
# JavaMailSender, and EmailService logs instead of sending. Supply these via
# environment variables to turn real email on:
#   spring.mail.host=${MAIL_HOST}
#   spring.mail.port=${MAIL_PORT:587}
#   spring.mail.username=${MAIL_USERNAME}
#   spring.mail.password=${MAIL_PASSWORD}
app.mail.from=no-reply@example.invalid

# One reminder per order that was placed but never paid for. Off by default,
# including in tests, so nothing schedules mail unless a deployment asks for it.
# Turn on with APP_PAYMENT_REMINDERS_ENABLED=true.
app.payment-reminders.enabled=${APP_PAYMENT_REMINDERS_ENABLED:false}
app.payment-reminders.after-hours=${APP_PAYMENT_REMINDERS_AFTER_HOURS:24}

# Unpaid orders hold their stock, so something has to give it back. On by
# default -- an order that reserves panels for ever is a bug, not an opt-in
# feature -- and the window is longer than the reminder above, so a customer
# is chased before their order lapses rather than after.
app.order-expiry.enabled=${APP_ORDER_EXPIRY_ENABLED:true}
app.order-expiry.after-hours=${APP_ORDER_EXPIRY_AFTER_HOURS:72}

# --- Admin ------------------------------------------------------------------
# Who holds ROLE_ADMIN, as a comma-separated list of addresses. The accounts
# must already exist: register and verify through the ordinary front door
# first, then name them here. Applied on every start, and anyone holding the
# role who is not listed loses it -- this variable is the whole truth about who
# is an administrator.
app.admin.emails=${APP_ADMIN_EMAILS:}

# Hostname that should open on the admin dashboard rather than the shop front
# page. Unset means no hostname is treated specially; /admin still works on the
# main address either way. The admin area is protected by ROLE_ADMIN, never by
# which hostname was used.
app.admin.host=${APP_ADMIN_HOST:}

# --- Error alerts -----------------------------------------------------------
# Emails whoever runs the shop when a page fails. The last outage was found by
# a customer taking a screenshot: /suppliers returned 500 to every visitor for
# twenty-five minutes and nothing in the system had an opinion about it.
#
# Recipients default to the administrators. With none set this does nothing, so
# a deployment is never held up waiting for it to be configured.
app.alerts.enabled=${APP_ALERTS_ENABLED:true}
app.alerts.recipients=${APP_ALERTS_RECIPIENTS:${APP_ADMIN_EMAILS:}}
# One fault stays quiet this long after being reported: you already know, and a
# second email adds nothing but noise.
app.alerts.cooldown-minutes=${APP_ALERTS_COOLDOWN_MINUTES:30}
# A ceiling across every fault, for the case the cooldown cannot cover -- many
# different errors at once, which is what a bad deploy looks like. It also stops
# a burst from spending a month of a free mail quota in an afternoon.
app.alerts.max-per-hour=${APP_ALERTS_MAX_PER_HOUR:10}

# --- Brand ------------------------------------------------------------------
# The name on the shop. It used to be typed into 51 places across 29 files --
# page titles, the header, the admin bar, every email subject and body -- so
# renaming it meant a find-and-replace and hoping. Now it is one setting.
#
# The defaults keep the shop working with nothing configured; whoever runs it
# next changes APP_BRAND_NAME and restarts.
app.brand.name=${APP_BRAND_NAME:SolarUpgrade}
app.brand.tagline=${APP_BRAND_TAGLINE:Panels, inverters and storage, delivered nationwide.}
# A character rather than an image, so a rename needs no new artwork.
#
# Written as a \uXXXX escape, not as the character itself. Java reads a
# .properties file as ISO-8859-1, so a literal UTF-8 sun arrived as the three
# bytes it is made of and every page and every email showed "a-tilde" mojibake
# where the mark should be. The escape is plain ASCII, so it survives whatever
# the file is decoded as. \u2600 is BLACK SUN WITH RAYS.
app.brand.mark=${APP_BRAND_MARK:\u2600}
# Says the catalogue is sample data. True while the seeded catalogue is showing
# and a lie the moment somebody loads real stock, so it is switchable.
app.brand.demo-notice=${APP_BRAND_DEMO_NOTICE:true}

# --- Search engines ---------------------------------------------------------
# Off by default, and deliberately so. The seeded catalogue is sample data with
# invented prices, and every legal page says "draft -- not in force" until the
# business details above are set. Being found with that showing is worse than
# not being found: the prices are wrong, the terms are not binding, and a search
# engine keeps its copy for weeks after either changes.
#
# The tags, sitemap and structured data are built either way. This decides
# whether anyone is invited to read them. Turn it on when the catalogue is real.
app.seo.indexable=${APP_SEO_INDEXABLE:false}
# The sentence under the shop's name in a search result, and the preview when a
# link is pasted into a chat. Pages that can describe themselves do.
app.seo.description=${APP_SEO_DESCRIPTION:Solar panels, inverters, batteries and mounting, delivered nationwide with installation-ready kits.}

# --- Business details -------------------------------------------------------
# What the terms, returns, privacy and contact pages are built from. They are
# configuration rather than template text because they belong to the business,
# not the code: a change of address should not be a change of markup.
#
# Empty by default, and every legal page carries a visible "draft" notice while
# any of them is. Pages built around invented details would be worse than none
# -- a customer relies on a returns address to exercise a right, and one that
# does not exist takes the right with it.
app.business.legal-name=${APP_BUSINESS_LEGAL_NAME:}
app.business.registration-number=${APP_BUSINESS_RC_NUMBER:}
app.business.address=${APP_BUSINESS_ADDRESS:}
app.business.phone=${APP_BUSINESS_PHONE:}
app.business.support-email=${APP_BUSINESS_SUPPORT_EMAIL:}
app.business.returns-window-days=${APP_BUSINESS_RETURNS_WINDOW_DAYS:7}
app.business.delivery-estimate=${APP_BUSINESS_DELIVERY_ESTIMATE:5 to 10 working days}

# --- Currency ---------------------------------------------------------------
# The catalogue is priced in naira and the books are kept in naira. PayPal
# cannot charge naira, so PayPal orders are converted to euro at this rate --
# a hand-set constant, not a live feed. Set it deliberately: a stale rate
# quietly changes what the shop earns on every PayPal sale.
app.exchange.naira-per-euro=${APP_NAIRA_PER_EURO:1800}

# --- PayPal -----------------------------------------------------------------
# Unset by default, which leaves PayPalClient unregistered and the "Pay now"
# button on its stand-in. Set all three on a deployment that should take real
# PayPal payments.
#
# The webhook id comes from the webhook you create in the PayPal dashboard
# pointing at <base-url>/payments/paypal/webhook. Without it the webhook
# endpoint ignores everything it receives, because it has no way to tell a
# genuine notification from a forged one.
app.paypal.client-id=${PAYPAL_CLIENT_ID:}
app.paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
app.paypal.webhook-id=${PAYPAL_WEBHOOK_ID:}
app.paypal.env=${PAYPAL_ENV:sandbox}

# --- Transport and session ---------------------------------------------------
# Render terminates TLS and proxies to the container, so without this the app
# believes every request is plain HTTP: Secure cookies would never be sent and
# HSTS would never be emitted. It is also what makes request.getRemoteAddr()
# resolve to the real client rather than the proxy, which the rate limiter
# depends on -- it reads that instead of the forgeable X-Forwarded-For header.
server.forward-headers-strategy=framework

# Secure is off by default so plain-HTTP local development still works, and set
# to true by the profiles that run behind TLS. SameSite=Lax keeps the cookie off
# cross-site requests while still allowing the top-level return from PayPal.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# --- Sign-in attempts --------------------------------------------------------
# Wrong passwords per account before a cooldown. Short on purpose: anything that
# locks an account on failed attempts also lets a stranger lock someone out by
# guessing their address, so the lock has to expire on its own.
app.login.max-failures=${LOGIN_MAX_FAILURES:5}
app.login.cooldown-minutes=${LOGIN_COOLDOWN_MINUTES:15}

# --- Actuator ---------------------------------------------------------------
# Expose only what is needed; the default would otherwise widen over time.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
