spring.application.name=shopping-webapp

# --- Datasource -------------------------------------------------------------
# Defaults to an in-memory H2 database so the app runs with no setup. Use the
# "mysql" profile for a real database (see application-mysql.properties).
spring.datasource.url=jdbc:h2:mem:solarupgrade;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway owns the schema; Hibernate only checks the entities still match it.
# A mismatch fails startup (and therefore the build) rather than surfacing as a
# broken query later.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# {vendor} resolves to h2, mysql or postgresql, picking the matching directory.
spring.flyway.locations=classpath:db/migration/{vendor}

# Seeds the demo catalogue and the demo account whose password is in the README.
# True only here, in the throwaway in-memory database. Every profile that points
# at a real database turns it off.
app.seed-demo-data=true

# Absolute base for links in outgoing email (the verification link). The app
# cannot work its own public address out from behind a proxy, so deployments
# must set APP_BASE_URL.
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Browse the dev database at http://localhost:8080/h2-console
spring.h2.console.enabled=true

# --- Mail -------------------------------------------------------------------
# Left unset on purpose. Without spring.mail.host Spring Boot does not create a
# JavaMailSender, and EmailService logs instead of sending. Supply these via
# environment variables to turn real email on:
#   spring.mail.host=${MAIL_HOST}
#   spring.mail.port=${MAIL_PORT:587}
#   spring.mail.username=${MAIL_USERNAME}
#   spring.mail.password=${MAIL_PASSWORD}
app.mail.from=no-reply@solarupgrade.example

# One reminder per order that was placed but never paid for. Off by default,
# including in tests, so nothing schedules mail unless a deployment asks for it.
# Turn on with APP_PAYMENT_REMINDERS_ENABLED=true.
app.payment-reminders.enabled=${APP_PAYMENT_REMINDERS_ENABLED:false}
app.payment-reminders.after-hours=${APP_PAYMENT_REMINDERS_AFTER_HOURS:24}

# --- Actuator ---------------------------------------------------------------
# Expose only what is needed; the default would otherwise widen over time.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
