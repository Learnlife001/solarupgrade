spring.application.name=shopping-webapp

# --- Datasource -------------------------------------------------------------
# Defaults to an in-memory H2 database so the app runs with no setup. Use the
# "mysql" profile for a real database (see application-mysql.properties).
spring.datasource.url=jdbc:h2:mem:solarupgrade;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway owns the schema; Hibernate only checks the entities still match it.
# A mismatch fails startup (and therefore the build) rather than surfacing as a
# broken query later.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# {vendor} resolves to h2, mysql or postgresql, picking the matching directory.
spring.flyway.locations=classpath:db/migration/{vendor}

# Seeds the demo catalogue and the demo account whose password is in the README.
# True only here, in the throwaway in-memory database. Every profile that points
# at a real database turns it off.
app.seed-demo-data=true

# Absolute base for links in outgoing email (the verification link). The app
# cannot work its own public address out from behind a proxy, so deployments
# must set APP_BASE_URL.
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Browse the dev database at http://localhost:8080/h2-console
spring.h2.console.enabled=true

# --- Mail -------------------------------------------------------------------
# Left unset on purpose. Without spring.mail.host Spring Boot does not create a
# JavaMailSender, and EmailService logs instead of sending. Supply these via
# environment variables to turn real email on:
#   spring.mail.host=${MAIL_HOST}
#   spring.mail.port=${MAIL_PORT:587}
#   spring.mail.username=${MAIL_USERNAME}
#   spring.mail.password=${MAIL_PASSWORD}
app.mail.from=no-reply@solarupgrade.example

# One reminder per order that was placed but never paid for. Off by default,
# including in tests, so nothing schedules mail unless a deployment asks for it.
# Turn on with APP_PAYMENT_REMINDERS_ENABLED=true.
app.payment-reminders.enabled=${APP_PAYMENT_REMINDERS_ENABLED:false}
app.payment-reminders.after-hours=${APP_PAYMENT_REMINDERS_AFTER_HOURS:24}

# --- Currency ---------------------------------------------------------------
# The catalogue is priced in naira and the books are kept in naira. PayPal
# cannot charge naira, so PayPal orders are converted to euro at this rate --
# a hand-set constant, not a live feed. Set it deliberately: a stale rate
# quietly changes what the shop earns on every PayPal sale.
app.exchange.naira-per-euro=${APP_NAIRA_PER_EURO:1800}

# --- PayPal -----------------------------------------------------------------
# Unset by default, which leaves PayPalClient unregistered and the "Pay now"
# button on its stand-in. Set all three on a deployment that should take real
# PayPal payments.
#
# The webhook id comes from the webhook you create in the PayPal dashboard
# pointing at <base-url>/payments/paypal/webhook. Without it the webhook
# endpoint ignores everything it receives, because it has no way to tell a
# genuine notification from a forged one.
app.paypal.client-id=${PAYPAL_CLIENT_ID:}
app.paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
app.paypal.webhook-id=${PAYPAL_WEBHOOK_ID:}
app.paypal.env=${PAYPAL_ENV:sandbox}

# --- Transport and session ---------------------------------------------------
# Render terminates TLS and proxies to the container, so without this the app
# believes every request is plain HTTP: Secure cookies would never be sent and
# HSTS would never be emitted. It is also what makes request.getRemoteAddr()
# resolve to the real client rather than the proxy, which the rate limiter
# depends on -- it reads that instead of the forgeable X-Forwarded-For header.
server.forward-headers-strategy=framework

# Secure is off by default so plain-HTTP local development still works, and set
# to true by the profiles that run behind TLS. SameSite=Lax keeps the cookie off
# cross-site requests while still allowing the top-level return from PayPal.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# --- Sign-in attempts --------------------------------------------------------
# Wrong passwords per account before a cooldown. Short on purpose: anything that
# locks an account on failed attempts also lets a stranger lock someone out by
# guessing their address, so the lock has to expire on its own.
app.login.max-failures=${LOGIN_MAX_FAILURES:5}
app.login.cooldown-minutes=${LOGIN_COOLDOWN_MINUTES:15}

# --- Actuator ---------------------------------------------------------------
# Expose only what is needed; the default would otherwise widen over time.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
