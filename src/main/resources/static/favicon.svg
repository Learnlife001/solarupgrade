<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SolarUpgrade">
  <defs>
    <linearGradient id="slBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d17f"/>
      <stop offset="100%" stop-color="#127a4a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#slBg)"/>
  <!-- Monogram. Geometric rather than a webfont so it renders identically
       everywhere, including at 16px in a browser tab. -->
  <text x="32" y="44"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="34" font-weight="700" letter-spacing="-1.5"
        text-anchor="middle" fill="#04240f">SL</text>
</svg>
