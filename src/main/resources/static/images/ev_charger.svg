<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="EV charger">
  <defs>
    <linearGradient id="evBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef5f1"/>
      <stop offset="100%" stop-color="#dce9e2"/>
    </linearGradient>
    <linearGradient id="evBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b3945"/>
      <stop offset="70%" stop-color="#1b2731"/>
      <stop offset="100%" stop-color="#111a22"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#evBg)"/>
  <ellipse cx="168" cy="256" rx="76" ry="12" fill="#0d1b2a" opacity=".12"/>

  <!-- wall plate -->
  <rect x="108" y="52" width="120" height="180" rx="24" fill="url(#evBody)"/>
  <rect x="118" y="62" width="100" height="160" rx="18" fill="none" stroke="#3d4c58" stroke-width="2"/>

  <!-- ring indicator -->
  <circle cx="168" cy="118" r="30" fill="none" stroke="#4ade80" stroke-width="7" stroke-linecap="round"
          stroke-dasharray="150 40" transform="rotate(-90 168 118)"/>
  <circle cx="168" cy="118" r="30" fill="#4ade80" opacity=".08"/>
  <path d="M172 100l-14 22h10l-3 16 15-23h-10z" fill="#4ade80"/>

  <!-- socket -->
  <rect x="146" y="168" width="44" height="34" rx="10" fill="#0b1218" stroke="#3d4c58" stroke-width="2"/>
  <g fill="#5a6b78">
    <circle cx="158" cy="180" r="4"/>
    <circle cx="178" cy="180" r="4"/>
    <circle cx="168" cy="192" r="4"/>
  </g>

  <!-- cable -->
  <path d="M228 200c46 0 44 42 22 48-20 6-30-10-16-18 18-10 44 8 44 30"
        fill="none" stroke="#1b2731" stroke-width="11" stroke-linecap="round"/>

  <!-- connector -->
  <rect x="266" y="248" width="30" height="26" rx="8" fill="#2b3945"/>
  <rect x="274" y="240" width="14" height="12" rx="4" fill="#3d4c58"/>
</svg>
