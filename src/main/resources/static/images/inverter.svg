<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Inverter">
  <defs>
    <linearGradient id="invBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef5f1"/>
      <stop offset="100%" stop-color="#dce9e2"/>
    </linearGradient>
    <linearGradient id="invBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e7ecef"/>
      <stop offset="100%" stop-color="#cfd8dd"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#invBg)"/>
  <ellipse cx="200" cy="256" rx="92" ry="12" fill="#0d1b2a" opacity=".12"/>

  <!-- body -->
  <rect x="128" y="52" width="144" height="196" rx="16" fill="url(#invBody)" stroke="#b9c4cb" stroke-width="2"/>

  <!-- screen -->
  <rect x="150" y="76" width="100" height="58" rx="7" fill="#12202e"/>
  <g fill="#4ade80">
    <rect x="162" y="94" width="42" height="7" rx="3.5"/>
    <rect x="162" y="108" width="26" height="5" rx="2.5"/>
  </g>
  <circle cx="234" cy="99" r="7" fill="#4ade80" opacity=".9"/>
  <circle cx="234" cy="99" r="12" fill="#4ade80" opacity=".2"/>

  <!-- vents -->
  <g fill="#c3ced5">
    <rect x="152" y="152" width="96" height="6" rx="3"/>
    <rect x="152" y="166" width="96" height="6" rx="3"/>
    <rect x="152" y="180" width="96" height="6" rx="3"/>
    <rect x="152" y="194" width="96" height="6" rx="3"/>
  </g>

  <!-- lower ports -->
  <g fill="#8e9ba4">
    <circle cx="166" cy="224" r="8"/>
    <circle cx="200" cy="224" r="8"/>
    <circle cx="234" cy="224" r="8"/>
  </g>

  <!-- conduit -->
  <path d="M200 52V30" stroke="#9aa8b2" stroke-width="9" stroke-linecap="round"/>
</svg>
