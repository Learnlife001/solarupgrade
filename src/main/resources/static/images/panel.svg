<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Solar panel">
  <defs>
    <linearGradient id="pnlBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef5f1"/>
      <stop offset="100%" stop-color="#dce9e2"/>
    </linearGradient>
    <linearGradient id="pnlGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b4a6f"/>
      <stop offset="55%" stop-color="#16293f"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="pnlShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#pnlBg)"/>

  <!-- ground shadow -->
  <ellipse cx="200" cy="248" rx="118" ry="14" fill="#0d1b2a" opacity=".13"/>

  <g transform="translate(200 150) skewY(-9)">
    <!-- frame -->
    <rect x="-118" y="-78" width="236" height="156" rx="6" fill="#c9d3d9"/>
    <rect x="-113" y="-73" width="226" height="146" rx="3" fill="url(#pnlGlass)"/>

    <!-- cells -->
    <g fill="none" stroke="#4e6f96" stroke-opacity=".55" stroke-width="1.6">
      <path d="M-75.3-73V73M-37.6-73V73M0-73V73M37.6-73V73M75.3-73V73"/>
      <path d="M-113-36.5H113M-113 0H113M-113 36.5H113"/>
    </g>
    <!-- busbars -->
    <g fill="#8fa9c4" opacity=".5">
      <rect x="-113" y="-2" width="226" height="1.6"/>
      <rect x="-113" y="-38.5" width="226" height="1.6"/>
      <rect x="-113" y="34.5" width="226" height="1.6"/>
    </g>
    <rect x="-113" y="-73" width="226" height="146" rx="3" fill="url(#pnlShine)"/>
  </g>

  <!-- support legs -->
  <g stroke="#9aa8b2" stroke-width="7" stroke-linecap="round">
    <path d="M-0 0" />
    <path d="M120 196v34M280 176v54"/>
  </g>
</svg>
