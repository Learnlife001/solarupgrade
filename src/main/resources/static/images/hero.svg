<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#bfe8ff"/><stop offset=".62" stop-color="#e8f6ff"/>
    <stop offset="1" stop-color="#fff3d9"/>
  </linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#ffd970" stop-opacity=".95"/>
    <stop offset="1" stop-color="#ffd970" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sunball" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#f2a712"/>
  </linearGradient>
  <linearGradient id="pv" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#33578c"/><stop offset="1" stop-color="#12253f"/>
  </linearGradient>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e7ede9"/>
  </linearGradient>
  <linearGradient id="cell" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#1faa62"/><stop offset="1" stop-color="#54e79b"/>
  </linearGradient>
</defs>

<rect width="640" height="420" fill="url(#sky)"/>

<!-- Sun, high and bright: the whole proposition in one shape. -->
<circle cx="516" cy="92" r="120" fill="url(#glow)"/>
<circle cx="516" cy="92" r="44" fill="url(#sunball)"/>

<!-- Ground line, kept plain: no lawn, no hedge, nothing that places this in
     a particular suburb. -->
<rect y="332" width="640" height="88" fill="#e4ded2"/>
<rect y="332" width="640" height="5" fill="#d3ccbd"/>

<!-- A low-pitch flat-topped block, closer to the roofline these panels
     actually get mounted on than a steep slate pitch. -->
<rect x="120" y="196" width="250" height="136" rx="4" fill="url(#wall)" stroke="#d3dbd6" stroke-width="2"/>
<rect x="108" y="182" width="274" height="20" rx="5" fill="#cfd8d2"/>

<!-- Lit windows: the point is that the power is on. -->
<rect x="146" y="236" width="46" height="40" rx="4" fill="#ffd970" stroke="#e8be55" stroke-width="2"/>
<rect x="212" y="236" width="46" height="40" rx="4" fill="#ffd970" stroke="#e8be55" stroke-width="2"/>
<rect x="278" y="236" width="46" height="40" rx="4" fill="#ffd970" stroke="#e8be55" stroke-width="2"/>
<rect x="212" y="292" width="46" height="40" rx="3" fill="#0f8f4f"/>

<!-- Panel array on the roof, tilted towards the sun. -->
<g transform="translate(118 96) skewY(-11)">
  <rect x="-6" y="-6" width="272" height="96" rx="7" fill="#b9c6d4"/>
  <g>
    <rect x="2" y="2" width="62" height="38" rx="2" fill="url(#pv)"/>
    <rect x="68" y="2" width="62" height="38" rx="2" fill="url(#pv)"/>
    <rect x="134" y="2" width="62" height="38" rx="2" fill="url(#pv)"/>
    <rect x="200" y="2" width="60" height="38" rx="2" fill="url(#pv)"/>
    <rect x="2" y="44" width="62" height="38" rx="2" fill="url(#pv)"/>
    <rect x="68" y="44" width="62" height="38" rx="2" fill="url(#pv)"/>
    <rect x="134" y="44" width="62" height="38" rx="2" fill="url(#pv)"/>
    <rect x="200" y="44" width="60" height="38" rx="2" fill="url(#pv)"/>
  </g>
</g>

<!-- Battery: the part that carries the house through an outage. -->
<rect x="416" y="236" width="104" height="96" rx="10" fill="url(#wall)" stroke="#c9d3cc" stroke-width="2"/>
<rect x="434" y="256" width="52" height="56" rx="4" fill="url(#cell)"/>
<circle cx="504" cy="252" r="6" fill="#54e79b"/>
<rect x="498" y="290" width="12" height="26" rx="4" fill="#4d6156"/>

<!-- Panels feeding the battery. -->
<path d="M370 214 Q400 226 416 250" fill="none" stroke="#0f8f4f" stroke-width="4"
      stroke-linecap="round" stroke-dasharray="9 8" opacity=".8"/>

<ellipse cx="245" cy="336" rx="150" ry="9" fill="#0d1a14" opacity=".08"/>
<ellipse cx="468" cy="336" rx="62" ry="7" fill="#0d1a14" opacity=".08"/>
</svg>
