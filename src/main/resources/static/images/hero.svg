<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img"
     aria-label="House with roof-mounted solar panels under a bright sky">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe3f5"/>
      <stop offset="55%" stop-color="#dff0f7"/>
      <stop offset="100%" stop-color="#eaf6ef"/>
    </linearGradient>
    <linearGradient id="roofGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#33547b"/>
      <stop offset="55%" stop-color="#1a2f47"/>
      <stop offset="100%" stop-color="#0e1c2b"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8eef1"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0%" stop-color="#fde68a" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="720" height="460" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="600" cy="96" r="96" fill="url(#sunGlow)"/>
  <circle cx="600" cy="96" r="34" fill="#fcd34d"/>

  <!-- distant hills -->
  <path d="M0 330c90-34 150 6 236-16s150-40 232-12 176 18 252-6v164H0z" fill="#cfe6d6"/>
  <path d="M0 356c110-26 168 12 268-10s164-30 250-6 132 14 202-4v124H0z" fill="#bcdcc7"/>

  <!-- ground -->
  <rect y="404" width="720" height="56" fill="#a9d2b6"/>

  <!-- house body -->
  <path d="M168 250h300v154H168z" fill="url(#wall)"/>
  <path d="M168 250h300v154H168z" fill="none" stroke="#c3ced5" stroke-width="2"/>

  <!-- roof -->
  <path d="M144 254L318 148l174 106z" fill="#8d5a4a"/>
  <path d="M144 254L318 148l174 106z" fill="none" stroke="#7a4c3e" stroke-width="3" stroke-linejoin="round"/>

  <!-- panel array on roof -->
  <g>
    <path d="M196 246l122-74 108 66-122 74z" fill="url(#roofGlass)"/>
    <g fill="none" stroke="#5c7ea6" stroke-opacity=".55" stroke-width="1.6">
      <path d="M226 228l108-66M256 246l108-66M286 264l108-66"/>
      <path d="M232 209l108 66M272 185l108 66"/>
    </g>
    <path d="M196 246l122-74 108 66-122 74z" fill="#ffffff" opacity=".08"/>
  </g>

  <!-- windows -->
  <g>
    <rect x="204" y="288" width="70" height="60" rx="5" fill="#294a68" opacity=".82"/>
    <rect x="362" y="288" width="70" height="60" rx="5" fill="#294a68" opacity=".82"/>
    <g stroke="#eef5f9" stroke-width="3" opacity=".75">
      <path d="M239 288v60M204 318h70M397 288v60M362 318h70"/>
    </g>
  </g>

  <!-- door -->
  <rect x="292" y="330" width="52" height="74" rx="6" fill="#2f6b4c"/>
  <circle cx="333" cy="368" r="3.6" fill="#f4e3b8"/>

  <!-- inverter on wall -->
  <rect x="486" y="300" width="26" height="40" rx="6" fill="#e7ecef" stroke="#b9c4cb" stroke-width="2"/>
  <rect x="492" y="308" width="14" height="10" rx="3" fill="#16a34a"/>

  <!-- energy flow -->
  <g stroke="#16a34a" stroke-width="3.5" stroke-linecap="round" fill="none" opacity=".85">
    <path d="M430 250c26 14 44 26 56 42" stroke-dasharray="9 9"/>
  </g>

  <!-- shrubs -->
  <g fill="#5fa877">
    <circle cx="140" cy="396" r="22"/>
    <circle cx="164" cy="402" r="15"/>
    <circle cx="524" cy="398" r="19"/>
  </g>
</svg>
