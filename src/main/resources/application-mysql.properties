# Activate with: SPRING_PROFILES_ACTIVE=mysql ./gradlew bootRun
#
# Every value is read from the environment. Do not put credentials in this file
# -- it is committed to version control.

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:solarupgrade}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# "validate" rather than "update": the schema is owned by the Flyway migrations
# in db/migration/mysql, not inferred from the entities at boot.
spring.jpa.hibernate.ddl-auto=validate

spring.h2.console.enabled=false
