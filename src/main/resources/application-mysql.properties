# Activate with: SPRING_PROFILES_ACTIVE=mysql ./gradlew bootRun
#
# Every value is read from the environment. Do not put credentials in this file
# -- it is committed to version control.

# sslMode=PREFERRED (the driver default) rather than the old useSSL=false.
# MySQL 8 authenticates with caching_sha2_password, which over an unencrypted
# connection needs the server's public key -- and requesting that key is refused
# by default, so useSSL=false fails outright with "Public Key Retrieval is not
# allowed". Keeping TLS on avoids the problem instead of loosening it with
# allowPublicKeyRetrieval=true. Override with DB_SSL_MODE=REQUIRED in
# production, or DISABLED only against a server you fully trust.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:solarupgrade}?sslMode=${DB_SSL_MODE:PREFERRED}&connectionTimeZone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# "validate" rather than "update": the schema is owned by the Flyway migrations
# in db/migration/mysql, not inferred from the entities at boot.
spring.jpa.hibernate.ddl-auto=validate

spring.h2.console.enabled=false

# Never seed the demo account into a real database.
app.seed-demo-data=false

# This profile only ever runs behind TLS, so the session cookie is marked Secure
# and will not be sent over a plain-HTTP request at all.
server.servlet.session.cookie.secure=true
