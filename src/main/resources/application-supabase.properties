# Supabase (PostgreSQL) profile.
# Activate with: SPRING_PROFILES_ACTIVE=supabase
#
# Every value comes from the environment -- nothing secret is committed.
# Find the connection details under Project Settings -> Database in the
# Supabase dashboard.

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSL_MODE:require}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Supabase caps connections, and the free tier caps them hard. A Render web
# service can run several instances, so keep each pool small rather than
# exhausting the database.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1

# Flyway owns the schema; Hibernate only checks the entities still match.
spring.jpa.hibernate.ddl-auto=validate

spring.h2.console.enabled=false

# Never seed the demo account into a real database.
app.seed-demo-data=false

# If you connect through Supabase's transaction-mode pooler (port 6543 on the
# pooler host) rather than a direct connection or the session pooler, server-side
# prepared statements are not supported and you must also set:
#   spring.datasource.hikari.data-source-properties.prepareThreshold=0
# A direct connection or the session pooler (port 5432) needs no such change.
