# Resend transactional email.
# Activate alongside a database profile, e.g.
#   SPRING_PROFILES_ACTIVE=postgres,resend
#
# This uses Resend's HTTP API rather than its SMTP endpoint. Resend offers both,
# and SMTP would need no code at all -- but outbound SMTP is commonly blocked on
# hosting platforms, and a blocked port 587 only shows up as a timeout at send
# time. HTTPS on 443 works anywhere the app runs. See ResendMailer.
#
# Create a key at https://resend.com/api-keys and set RESEND_API_KEY.

app.mail.resend.api-key=${RESEND_API_KEY}

# Must be an address on a domain verified in Resend, or every send is rejected.
# The verified domain on this account is auth.cgreglab.space.
app.mail.from=${MAIL_FROM:no-reply@example.invalid}

# --- SMTP alternative --------------------------------------------------------
# If you would rather use SMTP, delete the api-key line above and uncomment
# these. EmailService falls back to JavaMailSender when no Resend key is set.
# The username is the literal string "resend"; the password is the API key.
#
#   spring.mail.host=smtp.resend.com
#   spring.mail.port=587
#   spring.mail.username=resend
#   spring.mail.password=${RESEND_API_KEY}
#   spring.mail.properties.mail.smtp.auth=true
#   spring.mail.properties.mail.smtp.starttls.enable=true
#   spring.mail.properties.mail.smtp.starttls.required=true
