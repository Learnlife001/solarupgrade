<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reset your password')}"></head>
<body>

<div th:replace="~{fragments/layout :: header}"></div>

<main class="container narrow">
    <h1>Reset your password</h1>

    <p class="flash error" th:if="${error}" th:text="${error}"></p>

    <p class="note">
        Enter the address you signed up with and we will email you a link to set
        a new password. The link works once and expires in 30 minutes.
    </p>

    <section class="panel">
        <form th:action="@{/forgot-password}" method="post">
            <label>
                Email
                <input type="email" name="email" autocomplete="username" required autofocus>
            </label>
            <button type="submit" class="button-primary button-block">Email me a link</button>
        </form>
    </section>

    <p class="note mt-sm">
        Remembered it? <a th:href="@{/login}">Sign in</a> instead.
    </p>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
