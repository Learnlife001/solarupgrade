<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My orders &middot; SolarUpgrade</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: header}"></div>

<main class="container">
    <h1>My orders</h1>

    <div class="empty-state" th:if="${#lists.isEmpty(orders)}">
        <h2>No orders yet</h2>
        <p>When you place an order it will appear here. <a th:href="@{/products}">Browse the shop</a>.</p>
    </div>

    <div class="table-wrap" th:unless="${#lists.isEmpty(orders)}">
        <table class="line-items">
            <thead>
            <tr>
                <th>Order</th>
                <th>Placed</th>
                <th class="num">Items</th>
                <th class="num">Total</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td><a th:href="@{/orders/{id}(id=${order.id})}">#<span th:text="${order.id}">0</span></a></td>
                <td th:text="${order.placedAtShortDisplay}">date</td>
                <td class="num" th:text="${order.itemCount}">0</td>
                <td class="num">&pound;<span th:text="${#numbers.formatDecimal(order.total, 1, 2)}">0.00</span></td>
                <td>
                    <span class="status-pill"
                          th:classappend="${order.status.name() == 'PAID'} ? 'paid'"
                          th:text="${order.status.displayName}">status</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
