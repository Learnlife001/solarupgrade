<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My orders', null)}"></head>
<body>

<div th:replace="~{fragments/layout :: header}"></div>

<main class="container">
    <h1>My orders</h1>

    <div class="empty-state" th:if="${#lists.isEmpty(orders)}">
        <h2>No orders yet</h2>
        <p>When you place an order it will appear here. <a th:href="@{/products}">Browse the shop</a>.</p>
    </div>

    <div class="table-wrap" th:unless="${#lists.isEmpty(orders)}">
        <table class="line-items">
            <thead>
            <tr>
                <th>Order</th>
                <th>Placed</th>
                <th>Items</th>
                <th class="num">Total</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td><a th:href="@{/orders/{id}(id=${order.id})}">#<span th:text="${order.id}">0</span></a></td>
                <td th:text="${order.placedAtShortDisplay}">date</td>
                <!--
                  The products themselves, not just how many: an order is only
                  recognisable by what is in it.
                -->
                <td class="order-items">
                    <ul>
                        <li th:each="item : ${order.items}">
                            <span class="qty" th:text="${item.quantity}">1</span>
                            <span th:text="${item.productName}">Product</span>
                        </li>
                    </ul>
                    <p class="note" th:if="${order.paymentMethod != null}"
                       th:text="${order.paymentMethod.displayName}">Payment method</p>
                </td>
                <td class="num"><span th:text="${order.totalDisplay}">0.00</span></td>
                <td>
                    <span class="status-pill"
                          th:classappend="'status-' + ${order.status.name().toLowerCase()}"
                          th:text="${order.status.displayName}">status</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragments/pager :: pager(${pageNumber}, ${totalPages}, '/orders', null, null)}"></div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
