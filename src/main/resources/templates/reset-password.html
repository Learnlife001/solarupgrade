<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Set a new password · SolarUpgrade')}"></head>
<body>

<div th:replace="~{fragments/layout :: header}"></div>

<main class="container narrow">
    <h1>Set a new password</h1>

    <!--
      A dead link gets an explanation and a way forward, not a form that would
      only fail once filled in.
    -->
    <section th:if="${expired}">
        <p class="flash error">
            That reset link is no longer valid. Links work once and expire after
            30 minutes.
        </p>
        <p class="note">
            <a th:href="@{/forgot-password}">Request a new one</a> &mdash; it takes a moment.
        </p>
    </section>

    <section th:unless="${expired}">
        <p class="flash error" th:if="${error}" th:text="${error}"></p>

        <p class="note">
            Pick something long. Length does more for a password than symbols do,
            and this one guards your order history and delivery address.
        </p>

        <section class="panel">
            <form th:action="@{/reset-password}" method="post">
                <input type="hidden" name="token" th:value="${token}">
                <label>
                    New password
                    <input type="password" name="password" autocomplete="new-password"
                           minlength="10" required autofocus>
                </label>
                <label>
                    Confirm new password
                    <input type="password" name="confirmPassword" autocomplete="new-password"
                           minlength="10" required>
                </label>
                <button type="submit" class="button-primary button-block">Change my password</button>
            </form>
        </section>
    </section>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
