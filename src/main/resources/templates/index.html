<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SolarUpgrade</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: header}"></div>

<main class="container">
    <section class="hero">
        <h1>Upgrade your home to solar</h1>
        <p>Panels, inverters, storage and EV charging &mdash; everything for a domestic install.</p>
        <a class="button-primary" th:href="@{/products}">Browse the catalogue</a>
    </section>

    <h2>Featured</h2>
    <div class="product-grid">
        <article class="product-card" th:each="product : ${products}">
            <h3>
                <a th:href="@{/products/{id}(id=${product.id})}" th:text="${product.name}">Product</a>
            </h3>
            <p class="category" th:text="${product.category.displayName}">Category</p>
            <p class="price">&pound;<span th:text="${#numbers.formatDecimal(product.price, 1, 2)}">0.00</span></p>
        </article>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
