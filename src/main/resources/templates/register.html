<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register &middot; SolarUpgrade</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: header}"></div>

<main class="container narrow">
    <h1>Create an account</h1>

    <form th:action="@{/register}" th:object="${registrationForm}" method="post">
        <label>
            Full name
            <input type="text" th:field="*{fullName}">
            <span class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">error</span>
        </label>

        <label>
            Email
            <input type="email" th:field="*{email}" autocomplete="username">
            <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">error</span>
        </label>

        <label>
            Password
            <input type="password" th:field="*{password}" autocomplete="new-password">
            <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">error</span>
        </label>

        <label>
            Confirm password
            <input type="password" th:field="*{confirmPassword}" autocomplete="new-password">
            <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}"
                  th:errors="*{confirmPassword}">error</span>
        </label>

        <button type="submit" class="button-primary">Register</button>
    </form>

    <p>Already registered? <a th:href="@{/login}">Sign in</a>.</p>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
