<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(${product.name} + ' · SolarUpgrade')}"></head>
<body>

<div th:replace="~{fragments/layout :: header}"></div>

<main class="container">
    <p class="breadcrumb"><a th:href="@{/products}">&larr; Back to shop</a></p>

    <article class="product-detail">
        <div class="detail-art">
            <img th:src="@{${product.image}}" th:alt="${product.name}">
        </div>

        <div>
            <p class="category" th:text="${product.category.displayName}">Category</p>
            <h1 th:text="${product.name}">Product</h1>
            <p class="price large"><span th:text="${product.priceDisplay}">0.00</span></p>

            <p class="description" th:text="${product.description}">Description</p>

            <span class="badge in" th:if="${product.stock >= 10}"
                  th:text="${product.stock} + ' in stock'">In stock</span>
            <span class="badge low" th:if="${product.inStock and product.stock &lt; 10}"
                  th:text="'Only ' + ${product.stock} + ' left'">Low stock</span>
            <span class="badge out" th:unless="${product.inStock}">Out of stock</span>

            <form th:if="${product.inStock}" th:action="@{/cart/add}" method="post" class="add-to-cart"
                  sec:authorize="isAuthenticated()">
                <input type="hidden" name="productId" th:value="${product.id}">
                <label>
                    Quantity
                    <input type="number" name="quantity" value="1" min="1" th:max="${product.stock}" class="qty-input">
                </label>
                <button type="submit" class="button-primary">Add to basket</button>
            </form>

            <p sec:authorize="!isAuthenticated()" class="note mt-md">
                <a th:href="@{/login}">Sign in</a> to add items to your basket.
            </p>
        </div>
    </article>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
