<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--
      The fragment appends the shop's name rather than each page repeating it:
      21 call sites used to carry it, which is 21 places to miss when the shop
      is renamed.
    -->
    <title th:text="${pageTitle} + ' · ' + ${brand.name}">Shop</title>
    <!-- SVG favicon so the monogram stays sharp on any display. -->
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Not deferred: it must set the theme before the first paint, or a
         reader who chose dark gets a white flash on every page. -->
    <script th:src="@{/js/theme.js}"></script>
    <script th:src="@{/js/app.js}" defer></script>
</head>

<body>

<!--
  Shared site header. Included by every page via
  th:replace="~{fragments/layout :: header}".
-->
<header th:fragment="header" class="site-header">
    <div class="header-inner">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark" aria-hidden="true" th:text="${brand.mark}">&#9728;</span>
            <span th:text="${brand.name}">Shop</span>
        </a>

        <nav class="main-nav">
            <a th:href="@{/products}">Shop</a>
            <!--
              Beside Shop rather than down in the footer with the policies. It
              is something to read before deciding what to buy, and a footer is
              where links go to be ignored.
            -->
            <a th:href="@{/suppliers}">German suppliers</a>
            <a th:href="@{/orders}" sec:authorize="isAuthenticated()">Orders</a>
        </nav>

        <div class="header-actions">
            <!--
              The badge is always in the document, hidden when empty, so
              app.js can update it in place after an add rather than having to
              build the element.
            -->
            <a class="cart-link" th:href="@{/cart}" sec:authorize="isAuthenticated()">
                Basket
                <span class="cart-count" th:classappend="${cartCount == 0} ? 'is-empty'"
                      th:text="${cartCount}">0</span>
            </a>

            <span sec:authorize="isAuthenticated()" class="account">
                <span class="account-name" sec:authentication="name">user</span>
                <form th:action="@{/logout}" method="post" class="inline-form">
                    <button type="submit" class="link-button">Sign out</button>
                </form>
            </span>

            <span sec:authorize="!isAuthenticated()" class="account">
                <a th:href="@{/login}">Sign in</a>
                <a class="button-secondary" th:href="@{/register}">Register</a>
            </span>
        </div>
    </div>
</header>

<footer th:fragment="footer" class="site-footer">
    <div class="footer-inner">
        <!--
          The shop identifies itself first, then says where to go. Three
          centred sentences stacked in the middle read as an apology; a footer
          should look like the bottom of a shop.
        -->
        <div class="footer-brand">
            <span class="brand">
                <span class="brand-mark" aria-hidden="true" th:text="${brand.mark}">&#9728;</span>
                <span th:text="${brand.name}">Shop</span>
            </span>
            <p class="footer-tagline" th:text="${brand.tagline}">tagline</p>
        </div>

        <!--
          The policies, in the footer of every page because that is where
          people look for them, and because a returns policy nobody can find is
          not a policy. Labelled, so it is clear what the column is.
        -->
        <nav class="footer-nav" aria-label="Policies">
            <h2 class="footer-heading">Buying from us</h2>
            <ul class="footer-links">
                <li><a th:href="@{/terms}">Terms of sale</a></li>
                <li><a th:href="@{/returns}">Returns</a></li>
                <li><a th:href="@{/privacy}">Privacy</a></li>
                <li><a th:href="@{/contact}">Contact</a></li>
            </ul>
        </nav>
    </div>

    <div class="footer-bottom">
        <p class="footer-copy">
            &copy; <span th:text="${#temporals.year(#temporals.createNow())}">2026</span>
            <span th:text="${brand.name}">Shop</span>
        </p>
        <!-- Honest today, a lie the moment somebody loads real stock; hence a setting. -->
        <p class="footer-note" th:if="${brand.demoNotice}">
            Demo storefront &mdash; prices and stock are sample data.
        </p>
    </div>
</footer>

</body>
</html>
