<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Order #' + ${order.id} + ' · SolarUpgrade'">Order summary</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: header}"></div>

<main class="container">
    <div class="banner success" th:if="${justPlaced}">
        <span class="banner-tick" aria-hidden="true">&#10003;</span>
        <div>
            <h2>Thank you &mdash; your order is in</h2>
            <p>We have emailed a confirmation to your account address.</p>
        </div>
    </div>

    <h1>Order #<span th:text="${order.id}">0</span></h1>

    <dl class="order-meta">
        <dt>Placed</dt>
        <dd th:text="${order.placedAtDisplay}">date</dd>
        <dt>Status</dt>
        <dd>
            <span class="status-pill"
                  th:classappend="${order.status.name() == 'PAID'} ? 'paid'"
                  th:text="${order.status.displayName}">status</span>
        </dd>
        <dt>Delivering to</dt>
        <dd>
            <span th:text="${order.shippingName}">name</span><br>
            <span th:text="${order.shippingAddress}">address</span><br>
            <span th:text="${order.shippingPostcode}">postcode</span>
        </dd>
    </dl>

    <div class="table-wrap">
        <table class="line-items">
            <thead>
            <tr>
                <th>Product</th>
                <th class="num">Unit price</th>
                <th class="num">Quantity</th>
                <th class="num">Line total</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${order.items}">
                <td th:text="${item.productName}">Product</td>
                <td class="num">&pound;<span th:text="${#numbers.formatDecimal(item.unitPrice, 1, 2)}">0.00</span></td>
                <td class="num" th:text="${item.quantity}">1</td>
                <td class="num">&pound;<span th:text="${#numbers.formatDecimal(item.lineTotal, 1, 2)}">0.00</span></td>
            </tr>
            </tbody>
            <tfoot>
            <tr>
                <th colspan="3">Total</th>
                <th class="num">&pound;<span th:text="${#numbers.formatDecimal(order.total, 1, 2)}">0.00</span></th>
            </tr>
            </tfoot>
        </table>
    </div>

    <!--
      Stand-in for payment capture. A PayPal Orders API integration replaces this
      form with the provider's approval redirect, and OrderService.markPaid is
      only called once the capture is confirmed.
    -->
    <form th:if="${order.status.name() == 'PENDING_PAYMENT'}"
          th:action="@{/orders/{id}/pay(id=${order.id})}" method="post">
        <button type="submit" class="button-primary">Pay now</button>
        <span class="note">Placeholder &mdash; no payment provider is wired up yet.</span>
    </form>

    <p style="margin-top:2rem"><a th:href="@{/orders}">&larr; All orders</a></p>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
