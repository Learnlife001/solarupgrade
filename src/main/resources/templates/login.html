<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in · SolarUpgrade')}"></head>
<body>

<div th:replace="~{fragments/layout :: header}"></div>

<main class="container narrow">
    <h1>Sign in</h1>

    <p class="flash" th:if="${message}" th:text="${message}"></p>
    <p class="flash error" th:if="${error}" th:text="${error}"></p>
    <p class="flash error" th:if="${param.error}">Wrong email or password.</p>
    <p class="flash" th:if="${param.logout}">You have been signed out.</p>

    <div class="flash error" th:if="${param.unverified}">
        <strong>Confirm your email first.</strong>
        This account has not been confirmed yet, so it cannot sign in.
    </div>

    <section class="panel">
        <form th:action="@{/login}" method="post">
            <label>
                Email
                <input type="email" name="username" autocomplete="username" required>
            </label>
            <label>
                Password
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <button type="submit" class="button-primary button-block">Sign in</button>
        </form>
    </section>

    <!-- Only offered once the sign-in has actually been refused as unverified. -->
    <section class="panel" th:if="${param.unverified}" style="margin-top:1.25rem">
        <h2>Have a confirmation code?</h2>
        <p class="note">Enter the six-digit code we emailed you.</p>
        <a class="button-secondary button-block" th:href="@{/verify}">Enter code</a>
    </section>

    <p class="note" style="margin-top:1.25rem">
        No account? <a th:href="@{/register}">Register</a>.
    </p>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
