<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in &middot; SolarUpgrade</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: header}"></div>

<main class="container narrow">
    <h1>Sign in</h1>

    <p class="flash" th:if="${message}" th:text="${message}"></p>
    <p class="flash error" th:if="${error}" th:text="${error}"></p>
    <p class="flash error" th:if="${param.error}">Wrong email or password.</p>
    <p class="flash" th:if="${param.logout}">You have been signed out.</p>

    <div class="flash error" th:if="${param.unverified}">
        <strong>Confirm your email first.</strong>
        This account has not been confirmed yet, so it cannot sign in.
    </div>

    <section class="panel">
        <form th:action="@{/login}" method="post">
            <label>
                Email
                <input type="email" name="username" autocomplete="username" required>
            </label>
            <label>
                Password
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <button type="submit" class="button-primary button-block">Sign in</button>
        </form>
    </section>

    <!-- Only offered once the sign-in has actually been refused as unverified. -->
    <section class="panel" th:if="${param.unverified}" style="margin-top:1.25rem">
        <h2>Send a new confirmation link</h2>
        <form th:action="@{/resend-verification}" method="post">
            <label>
                Email
                <input type="email" name="email" autocomplete="username" required>
            </label>
            <button type="submit" class="button-secondary button-block">Resend link</button>
        </form>
    </section>

    <p class="note" style="margin-top:1.25rem">
        No account? <a th:href="@{/register}">Register</a>.
    </p>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
