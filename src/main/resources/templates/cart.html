<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Your basket · SolarUpgrade')}"></head>
<body>

<div th:replace="~{fragments/layout :: header}"></div>

<main class="container">
    <h1>Your basket</h1>

    <p class="flash" th:if="${message}" th:text="${message}"></p>
    <p class="flash error" th:if="${error}" th:text="${error}"></p>

    <div class="empty-state" th:if="${#lists.isEmpty(items)}">
        <h2>Your basket is empty</h2>
        <p><a th:href="@{/products}">Browse the shop</a> to get started.</p>
    </div>

    <div th:unless="${#lists.isEmpty(items)}">
        <div class="table-wrap">
            <table class="line-items">
                <thead>
                <tr>
                    <th>Product</th>
                    <th class="num">Price</th>
                    <th>Quantity</th>
                    <th class="num">Line total</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${items}">
                    <td>
                        <div class="cart-product">
                            <img th:src="@{${item.product.image}}" th:alt="${item.product.name}">
                            <a th:href="@{/products/{id}(id=${item.product.id})}" th:text="${item.product.name}">Product</a>
                        </div>
                    </td>
                    <td class="num"><span th:text="${item.product.priceDisplay}">0.00</span></td>
                    <td>
                        <form th:action="@{/cart/{id}/update(id=${item.id})}" method="post" class="inline-form">
                            <input type="number" name="quantity" th:value="${item.quantity}" min="0" class="qty-input"
                                   aria-label="Quantity">
                            <button type="submit" class="link-button">Update</button>
                        </form>
                    </td>
                    <td class="num"><span th:text="${item.lineTotalDisplay}">0.00</span></td>
                    <td>
                        <form th:action="@{/cart/{id}/remove(id=${item.id})}" method="post" class="inline-form">
                            <button type="submit" class="link-button danger">Remove</button>
                        </form>
                    </td>
                </tr>
                </tbody>
                <tfoot>
                <tr>
                    <th colspan="3">Total</th>
                    <th class="num" colspan="2"><span th:text="${totalDisplay}">0.00</span></th>
                </tr>
                </tfoot>
            </table>
        </div>

        <a class="button-primary" th:href="@{/checkout}">Proceed to checkout</a>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
